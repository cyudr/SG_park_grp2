<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#005a3c"/>
      <stop offset="60%" stop-color="#004028"/>
      <stop offset="100%" stop-color="#002919"/>
    </linearGradient>

    <!-- Glass / Ambient Glow Gradient -->
    <radialGradient id="ambientGlow" cx="30%" cy="20%" r="70%">
      <stop offset="0%" stop-color="#71dba6" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Sun Glow -->
    <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffd166"/>
      <stop offset="60%" stop-color="#ffb703"/>
      <stop offset="100%" stop-color="#fb8500" stop-opacity="0"/>
    </radialGradient>

    <!-- Sun Core Gradient -->
    <linearGradient id="sunGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe680"/>
      <stop offset="50%" stop-color="#ffb703"/>
      <stop offset="100%" stop-color="#fb8500"/>
    </linearGradient>

    <!-- Canopy Gradient (Front Tree) -->
    <linearGradient id="canopyFront" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a3f0c4"/>
      <stop offset="50%" stop-color="#71dba6"/>
      <stop offset="100%" stop-color="#22c55e"/>
    </linearGradient>

    <!-- Canopy Gradient (Back Tree) -->
    <linearGradient id="canopyBack" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="100%" stop-color="#0f766e"/>
    </linearGradient>

    <!-- Cloud Gradient -->
    <linearGradient id="cloudGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="85%" stop-color="#f1f5f9"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>

    <!-- Rain Drop Gradient -->
    <linearGradient id="rainGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7dd3fc"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <!-- Cloud Shadow Filter -->
    <filter id="shadowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#00180e" flood-opacity="0.45"/>
    </filter>

    <!-- Tree Shadow Filter -->
    <filter id="treeShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#00120b" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- App Icon Base Squircle -->
  <rect width="512" height="512" rx="116" fill="url(#bgGrad)"/>
  <rect width="512" height="512" rx="116" fill="url(#ambientGlow)"/>

  <!-- Subtle Outer Border Stroke -->
  <rect width="508" height="508" x="2" y="2" rx="114" fill="none" stroke="#71dba6" stroke-width="4" stroke-opacity="0.25"/>

  <!-- Golden Tropical Sun with Glow (Top Right) -->
  <circle cx="340" cy="170" r="85" fill="url(#sunGlow)" opacity="0.6"/>
  <circle cx="340" cy="170" r="54" fill="url(#sunGrad)"/>

  <!-- Background Rainforest Tree Canopy (Left / Center-Left) -->
  <g filter="url(#treeShadow)">
    <!-- Back Trunk -->
    <path d="M190 330 Q195 380 205 440 L175 440 Q180 380 178 330 Z" fill="#14532d" opacity="0.85"/>
    <!-- Back Foliage Layers -->
    <circle cx="185" cy="275" r="62" fill="url(#canopyBack)"/>
    <circle cx="140" cy="295" r="48" fill="url(#canopyBack)"/>
    <circle cx="230" cy="290" r="46" fill="url(#canopyBack)"/>
  </g>

  <!-- Foreground Supertree / Heritage Tree (Center-Right) -->
  <g filter="url(#treeShadow)">
    <!-- Main Tree Trunk / Supertree Column -->
    <path d="M290 320 Q296 380 310 440 L266 440 Q278 380 280 320 Z" fill="#064e3b"/>
    <!-- Trunk Core Texture Rings -->
    <line x1="282" y1="350" x2="294" y2="350" stroke="#71dba6" stroke-width="3" stroke-linecap="round" opacity="0.6"/>
    <line x1="278" y1="380" x2="298" y2="380" stroke="#71dba6" stroke-width="3.5" stroke-linecap="round" opacity="0.6"/>
    <line x1="274" y1="410" x2="304" y2="410" stroke="#71dba6" stroke-width="4" stroke-linecap="round" opacity="0.6"/>

    <!-- Lush Tiered Canopy Foliage (Supertree & Banyan Canopy) -->
    <circle cx="286" cy="235" r="76" fill="url(#canopyFront)"/>
    <circle cx="230" cy="255" r="58" fill="url(#canopyFront)"/>
    <circle cx="342" cy="250" r="56" fill="url(#canopyFront)"/>
    <circle cx="286" cy="190" r="46" fill="#bbf7d0"/>
  </g>

  <!-- Weather Rain Cloud (Floating Front Layer) -->
  <g filter="url(#shadowFilter)">
    <path d="M 175 220 
             A 38 38 0 0 1 228 178 
             A 52 52 0 0 1 316 182 
             A 36 36 0 0 1 346 220 
             A 30 30 0 0 1 336 260 
             L 165 260 
             A 30 30 0 0 1 175 220 Z" 
          fill="url(#cloudGrad)"/>
    
    <!-- Cloud Highlight Rim -->
    <path d="M 180 216 
             A 36 36 0 0 1 230 182 
             A 50 50 0 0 1 312 186" 
          fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity="0.9"/>
  </g>

  <!-- Rain Drops (Angled Dynamic Tropical Showers) -->
  <g>
    <!-- Drop 1 -->
    <path d="M 200 282 L 190 308 A 7 7 0 1 0 204 308 Z" fill="url(#rainGrad)" transform="rotate(-12 200 295)"/>
    <!-- Drop 2 -->
    <path d="M 245 288 L 235 318 A 8 8 0 1 0 251 318 Z" fill="url(#rainGrad)" transform="rotate(-12 245 305)"/>
    <!-- Drop 3 -->
    <path d="M 290 284 L 280 312 A 7.5 7.5 0 1 0 295 312 Z" fill="url(#rainGrad)" transform="rotate(-12 290 300)"/>
  </g>

  <!-- Park Ground Horizon Accent -->
  <path d="M 40 440 Q 256 425 472 440 L 472 460 Q 256 448 40 460 Z" fill="#00331f" opacity="0.9"/>
  <path d="M 80 436 Q 256 422 432 436" fill="none" stroke="#71dba6" stroke-width="4" stroke-linecap="round" opacity="0.4"/>
</svg>
